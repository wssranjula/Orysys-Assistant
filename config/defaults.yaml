api:
  max_message_characters: 8000
  max_response_characters: 20000
  request_timeout_seconds: 120

agent:
  model: gpt-5-mini
  synthesis_enabled: true

rate_limits:
  viewer:
    capacity: 10
    refill_per_minute: 5
  analyst:
    capacity: 30
    refill_per_minute: 15
  administrator:
    capacity: 60
    refill_per_minute: 30

retrieval:
  candidate_count: 20
  final_count: 6
  max_chunk_characters: 6000
  dense_weight: 0.65
  sparse_weight: 0.35
  timeout_seconds: 15
  min_sparse_score: 0.1

research:
  max_initial_tasks: 4
  max_followup_tasks: 2
  max_recursion_depth: 2
  max_parallel_workers: 3
  max_total_tool_calls: 20
  max_chunks_per_worker: 6
  worker_timeout_seconds: 25
  overall_timeout_seconds: 90

tools:
  default_timeout_seconds: 10
  max_result_bytes: 100000
  max_analysis_records: 1000

memory:
  max_recent_messages: 20
  max_summary_characters: 8000

retries:
  llm: 1
  pinecone: 2
  mcp: 1
  base_delay_ms: 250
  jitter: true
